apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vector-topo-sync.fullname" . }}
  labels:
    {{- include "vector-topo-sync.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "vector-topo-sync.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "vector-topo-sync.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: vector
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: vector-root
              mountPath: /host-vector
            - name: nginx-log-file
              mountPath: /host-nginx-log/input.log
              readOnly: true
            - name: bootstrap-config
              mountPath: /bootstrap-config
              readOnly: true
      volumes:
        - name: vector-root
          hostPath:
            path: {{ .Values.hostPaths.vectorRoot | quote }}
            type: DirectoryOrCreate
        - name: nginx-log-file
          hostPath:
            path: {{ .Values.hostPaths.nginxLogFile | quote }}
            type: File
        - name: bootstrap-config
          configMap:
            name: {{ include "vector-topo-sync.fullname" . }}-bootstrap-config
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
