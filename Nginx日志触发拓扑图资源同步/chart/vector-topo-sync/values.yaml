replicaCount: 1

image:
  repository: registry.example.com/uino/vector-topo-sync
  tag: "0.33.1"
  pullPolicy: IfNotPresent
  pullSecrets: []

nameOverride: ""
fullnameOverride: ""

hostPaths:
  vectorRoot: /data/uinnova/apps/vector
  nginxLogFile: /data/uinnova/apps/nginx/logs/sync_topo.log

vector:
  source:
    requestMethod: POST
    requestPath: /thing-api/topo/eam/esDiagram/saveOrUpdateDiagramComponent
    successStatus:
      min: 200
      max: 299
  extract:
    requestBodyField: diagramId
    targetField: topoId
  sink:
    method: post
    uri: http://10.100.30.239:8180/projectScene/offlineTopo/sync

podAnnotations: {}

podSecurityContext: {}

securityContext:
  runAsUser: 0
  runAsGroup: 0
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}
