# 文件说明：提供 Helm 测试使用的完整有效覆盖值，地址和 digest 均为保留示例数据。
# 固定镜像身份用于断言离线私有仓库、ARM64 tag 与 digest 的组合。
image:
  repository: registry.internal.example/uino/elasticsearch
  tag: 7.10.2-arm64-hardened
  digest: sha256:1111111111111111111111111111111111111111111111111111111111111111
  pullSecrets:
    - name: registry-credentials

# 使用文档保留网段验证 MetalLB 固定 IP、来源 CIDR 和自定义注解。
service:
  type: LoadBalancer
  port: 9200
  loadBalancerIP: 192.0.2.50
  addressPool: first-pool
  protocol: layer2
  externalTrafficPolicy: Local
  loadBalancerSourceRanges:
    - 198.51.100.0/24
  allowSharedIP: false
  sharedIPKey: ""
  annotations:
    example.com/owner: platform

# 同时提供 DNS 目标和授权客户端的 namespace/pod 双重选择器。
networkPolicy:
  dns:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kube-system
    podSelector:
      matchLabels:
        k8s-app: kube-dns
  authorizedPeers:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: uino
      podSelector:
        matchLabels:
          app.kubernetes.io/name: elasticsearch-client
          app.kubernetes.io/instance: es-cluster
          app.kubernetes.io/component: snapshot

# 使用文档保留地址验证 NFS 仓库、集群子目录和 SLM 保留策略。
snapshot:
  enabled: true
  repositoryName: uino-es-snapshot
  nfs:
    server: 192.0.2.60
    path: /exports/es-snapshots
  mountPath: /mnt/es-snapshots
  clusterPath: uino/es-cluster
  slm:
    enabled: true
    name: uino-es-daily
    schedule: "0 30 1 * * ?"
    snapshotName: "<uino-es-snapshot-{now/d}>"
    retention:
      expireAfter: 30d
      minCount: 5
      maxCount: 50
