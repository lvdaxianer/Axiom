# 文件说明：演示客户离线环境必须覆盖的镜像、MetalLB 固定地址和 NFS 快照参数。
# 安装前必须替换全部文档示例地址和镜像 digest，示例值不能直接用于生产环境。
image:
  repository: registry.internal.example/uino/elasticsearch
  tag: 7.10.2-arm64-hardened
  digest: sha256:1111111111111111111111111111111111111111111111111111111111111111
  pullPolicy: IfNotPresent
  pullSecrets:
    - name: registry-credentials

# 固定 IP 必须属于 first-pool，来源网段应收敛到实际调用方。
service:
  loadBalancerIP: 192.0.2.50
  loadBalancerSourceRanges:
    - 198.51.100.0/24

# NFS server/path 必须能被所有 Worker 访问，clusterPath 应保持集群独占。
snapshot:
  enabled: true
  repositoryName: uino-es-snapshot
  nfs:
    server: 192.0.2.60
    path: /exports/es-snapshots
  mountPath: /mnt/es-snapshots
  clusterPath: uino/es-cluster
  slm:
    enabled: true
    name: uino-es-daily
    schedule: "0 30 1 * * ?"
    snapshotName: "<uino-es-snapshot-{now/d}>"
    retention:
      expireAfter: 30d
      minCount: 5
      maxCount: 50
