{{- /* 文件说明：要求三节点集群在主动驱逐期间至少保留两个可用 Pod，以维持多数派。 */ -}}
apiVersion: policy/v1{{/* 行说明：指定 Kubernetes 或 Helm 使用的 API 版本。 */}}
kind: PodDisruptionBudget{{/* 行说明：声明当前清单创建的 Kubernetes 资源类型。 */}}
metadata:{{/* 行说明：配置 metadata 字段，形成 pdb.yaml 所需资源。 */}}
  name: {{ include "uino-elasticsearch.fullname" . }}{{/* 行说明：设置当前对象、容器、端口或引用项的名称。 */}}
  labels:{{/* 行说明：配置 labels 字段，形成 pdb.yaml 所需资源。 */}}
    {{- /* 行说明：执行 Helm 模板表达式并将结果写入当前位置。 */}}{{- include "uino-elasticsearch.labels" . | nindent 4 }}
spec:{{/* 行说明：配置 spec 字段，形成 pdb.yaml 所需资源。 */}}
  minAvailable: 2{{/* 行说明：配置 minAvailable 字段，形成 pdb.yaml 所需资源。 */}}
  selector:{{/* 行说明：配置 selector 字段，形成 pdb.yaml 所需资源。 */}}
    matchLabels:{{/* 行说明：定义必须全部匹配的 Kubernetes 标签集合。 */}}
      {{- /* 行说明：执行 Helm 模板表达式并将结果写入当前位置。 */}}{{- include "uino-elasticsearch.selectorLabels" . | nindent 6 }}
