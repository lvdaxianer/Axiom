{{- if not .Values.tls.existingSecret }}
{{- $name := include "uino-elasticsearch.tlsSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $existingData := dict -}}
{{- if $existing -}}
{{- $existingData = default dict $existing.data -}}
{{- if or (not (hasKey $existingData "tls.crt")) (not (hasKey $existingData "tls.key")) (not (hasKey $existingData "ca.crt")) -}}
{{- fail "managed TLS Secret must contain non-empty tls.crt, tls.key, and ca.crt keys" -}}
{{- end -}}
{{- if or (empty (index $existingData "tls.crt")) (empty (index $existingData "tls.key")) (empty (index $existingData "ca.crt")) -}}
{{- fail "managed TLS Secret must contain non-empty tls.crt, tls.key, and ca.crt keys" -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "uino-elasticsearch.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: kubernetes.io/tls
data:
  {{ if $existing }}
  tls.crt: {{ index $existingData "tls.crt" | quote }}
  tls.key: {{ index $existingData "tls.key" | quote }}
  ca.crt: {{ index $existingData "ca.crt" | quote }}
  {{ else }}
  {{- $fullname := include "uino-elasticsearch.fullname" . -}}
  {{- $headless := include "uino-elasticsearch.headlessServiceName" . -}}
  {{- $ca := genCA (printf "%s-ca" $fullname) 3650 -}}
  {{- $ips := list "127.0.0.1" -}}
  {{- $serviceIP := default "" .Values.environment.loadBalancerIP -}}
  {{- if $serviceIP }}
  {{- $ips = append $ips $serviceIP -}}
  {{- end }}
  {{- $dns := list "localhost" $fullname (printf "%s.%s.svc" $fullname .Release.Namespace) $headless (printf "%s.%s.svc" $headless .Release.Namespace) (printf "*.%s" $headless) (printf "*.%s.%s.svc" $headless .Release.Namespace) -}}
  {{- $cert := genSignedCert $fullname $ips $dns 3650 $ca -}}
  tls.crt: {{ $cert.Cert | b64enc | quote }}
  tls.key: {{ $cert.Key | b64enc | quote }}
  ca.crt: {{ $ca.Cert | b64enc | quote }}
  {{- end }}
{{- end }}
