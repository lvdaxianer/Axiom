{{- /* 文件说明：创建并跨升级复用集群 TLS 材料，或在配置外部证书时仅引用既有 Secret。 */ -}}
{{- /* 行说明：仅在该 Helm 条件成立时渲染后续内容。 */}}{{- if not .Values.tls.existingSecret }}
{{- /* 行说明：计算并保存后续模板渲染需要的局部变量。 */}}{{- $name := include "uino-elasticsearch.tlsSecretName" . -}}
{{- /* 行说明：计算并保存后续模板渲染需要的局部变量。 */}}{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- /* 行说明：计算并保存后续模板渲染需要的局部变量。 */}}{{- $existingData := dict -}}
{{- /* 行说明：仅在该 Helm 条件成立时渲染后续内容。 */}}{{- if $existing -}}
{{- /* 行说明：计算并保存后续模板渲染需要的局部变量。 */}}{{- $existingData = default dict $existing.data -}}
{{- /* 行说明：仅在该 Helm 条件成立时渲染后续内容。 */}}{{- if or (not (hasKey $existingData "tls.crt")) (not (hasKey $existingData "tls.key")) (not (hasKey $existingData "ca.crt")) -}}
{{- /* 行说明：配置违反安全约束时立即终止 Helm 渲染。 */}}{{- fail "managed TLS Secret must contain non-empty tls.crt, tls.key, and ca.crt keys" -}}
{{- /* 行说明：结束当前 Helm 定义、条件或遍历块。 */}}{{- end -}}
{{- /* 行说明：仅在该 Helm 条件成立时渲染后续内容。 */}}{{- if or (empty (index $existingData "tls.crt")) (empty (index $existingData "tls.key")) (empty (index $existingData "ca.crt")) -}}
{{- /* 行说明：配置违反安全约束时立即终止 Helm 渲染。 */}}{{- fail "managed TLS Secret must contain non-empty tls.crt, tls.key, and ca.crt keys" -}}
{{- /* 行说明：结束当前 Helm 定义、条件或遍历块。 */}}{{- end -}}
{{- /* 行说明：结束当前 Helm 定义、条件或遍历块。 */}}{{- end -}}
apiVersion: v1{{/* 行说明：指定 Kubernetes 或 Helm 使用的 API 版本。 */}}
kind: Secret{{/* 行说明：声明当前清单创建的 Kubernetes 资源类型。 */}}
metadata:{{/* 行说明：配置 metadata 字段，形成 tls-secret.yaml 所需资源。 */}}
  name: {{ $name }}{{/* 行说明：设置当前对象、容器、端口或引用项的名称。 */}}
  labels:{{/* 行说明：配置 labels 字段，形成 tls-secret.yaml 所需资源。 */}}
    {{- /* 行说明：执行 Helm 模板表达式并将结果写入当前位置。 */}}{{- include "uino-elasticsearch.labels" . | nindent 4 }}
  annotations:{{/* 行说明：配置 Helm 卸载时保留 TLS 材料的资源策略。 */}}
    # 卸载 release 时保留证书，避免持久化节点重装后出现身份材料突变。
    helm.sh/resource-policy: keep{{/* 行说明：配置 helm.sh/resource-policy 字段，形成 tls-secret.yaml 所需资源。 */}}
type: kubernetes.io/tls{{/* 行说明：使用 Kubernetes TLS Secret 类型保存证书和私钥。 */}}
data:{{/* 行说明：配置 data 字段，形成 tls-secret.yaml 所需资源。 */}}
  {{ if $existing }}{{/* 行说明：仅在该 Helm 条件成立时渲染后续内容。 */}}
  tls.crt: {{ index $existingData "tls.crt" | quote }}{{/* 行说明：配置 tls.crt 字段，形成 tls-secret.yaml 所需资源。 */}}
  tls.key: {{ index $existingData "tls.key" | quote }}{{/* 行说明：配置 tls.key 字段，形成 tls-secret.yaml 所需资源。 */}}
  ca.crt: {{ index $existingData "ca.crt" | quote }}{{/* 行说明：配置 ca.crt 字段，形成 tls-secret.yaml 所需资源。 */}}
  {{ else }}{{/* 行说明：条件不成立时切换到备用渲染分支。 */}}
  {{- /* 新证书同时覆盖本地探针、Service、无头 Service、Pod DNS 和 MetalLB 固定 IP。 */ -}}
  {{- /* 行说明：计算并保存后续模板渲染需要的局部变量。 */}}{{- $fullname := include "uino-elasticsearch.fullname" . -}}
  {{- /* 行说明：计算并保存后续模板渲染需要的局部变量。 */}}{{- $headless := include "uino-elasticsearch.headlessServiceName" . -}}
  {{- /* 行说明：计算并保存后续模板渲染需要的局部变量。 */}}{{- $ca := genCA (printf "%s-ca" $fullname) 3650 -}}
  {{- /* 行说明：计算并保存后续模板渲染需要的局部变量。 */}}{{- $ips := list "127.0.0.1" -}}
  {{- /* 行说明：计算并保存后续模板渲染需要的局部变量。 */}}{{- $serviceIP := .Values.service.loadBalancerIP -}}
  {{- /* 行说明：结束当前 Helm 定义、条件或遍历块。 */}}{{- $ips = append $ips $serviceIP -}}
  {{- /* 行说明：计算并保存后续模板渲染需要的局部变量。 */}}{{- $dns := list "localhost" $fullname (printf "%s.%s.svc" $fullname .Release.Namespace) $headless (printf "%s.%s.svc" $headless .Release.Namespace) (printf "*.%s" $headless) (printf "*.%s.%s.svc" $headless .Release.Namespace) -}}
  {{- /* 行说明：计算并保存后续模板渲染需要的局部变量。 */}}{{- $cert := genSignedCert $fullname $ips $dns 3650 $ca -}}
  tls.crt: {{ $cert.Cert | b64enc | quote }}{{/* 行说明：配置 tls.crt 字段，形成 tls-secret.yaml 所需资源。 */}}
  tls.key: {{ $cert.Key | b64enc | quote }}{{/* 行说明：配置 tls.key 字段，形成 tls-secret.yaml 所需资源。 */}}
  ca.crt: {{ $ca.Cert | b64enc | quote }}{{/* 行说明：配置 ca.crt 字段，形成 tls-secret.yaml 所需资源。 */}}
  {{- /* 行说明：结束当前 Helm 定义、条件或遍历块。 */}}{{- end }}
{{- /* 行说明：结束当前 Helm 定义、条件或遍历块。 */}}{{- end }}
