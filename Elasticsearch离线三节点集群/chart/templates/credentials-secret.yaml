{{- /* 文件说明：创建并跨 Helm 升级复用 elastic 管理员密码；配置外部 Secret 时不生成资源。 */ -}}
{{- /* 行说明：仅在该 Helm 条件成立时渲染后续内容。 */}}{{- if not .Values.security.existingCredentialsSecret }}
{{- /* 行说明：计算并保存后续模板渲染需要的局部变量。 */}}{{- $name := include "uino-elasticsearch.credentialsSecretName" . -}}
{{- /* 新安装生成随机密码，升级时 lookup 既有 Secret，避免凭据被意外轮换。 */ -}}
{{- /* 行说明：计算并保存后续模板渲染需要的局部变量。 */}}{{- $password := randAlphaNum 32 | b64enc -}}
{{- /* 行说明：计算并保存后续模板渲染需要的局部变量。 */}}{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- /* 行说明：仅在该 Helm 条件成立时渲染后续内容。 */}}{{- if $existing -}}
{{- /* 行说明：计算并保存后续模板渲染需要的局部变量。 */}}{{- $existingData := default dict $existing.data -}}
{{- /* 行说明：仅在该 Helm 条件成立时渲染后续内容。 */}}{{- if or (not (hasKey $existingData "elastic-password")) (empty (index $existingData "elastic-password")) -}}
{{- /* 行说明：配置违反安全约束时立即终止 Helm 渲染。 */}}{{- fail "managed credentials Secret must contain a non-empty elastic-password key" -}}
{{- /* 行说明：结束当前 Helm 定义、条件或遍历块。 */}}{{- end -}}
{{- /* 行说明：计算并保存后续模板渲染需要的局部变量。 */}}{{- $password = index $existing.data "elastic-password" -}}
{{- /* 行说明：结束当前 Helm 定义、条件或遍历块。 */}}{{- end }}
apiVersion: v1{{/* 行说明：指定 Kubernetes 或 Helm 使用的 API 版本。 */}}
kind: Secret{{/* 行说明：声明当前清单创建的 Kubernetes 资源类型。 */}}
metadata:{{/* 行说明：配置 metadata 字段，形成 credentials-secret.yaml 所需资源。 */}}
  name: {{ $name }}{{/* 行说明：设置当前对象、容器、端口或引用项的名称。 */}}
  labels:{{/* 行说明：配置 labels 字段，形成 credentials-secret.yaml 所需资源。 */}}
    {{- /* 行说明：执行 Helm 模板表达式并将结果写入当前位置。 */}}{{- include "uino-elasticsearch.labels" . | nindent 4 }}
  annotations:{{/* 行说明：配置 Helm 卸载时保留管理员凭据的资源策略。 */}}
    # 卸载 release 时保留凭据，防止重装后无法读取仍在使用的持久化数据。
    helm.sh/resource-policy: keep{{/* 行说明：配置 helm.sh/resource-policy 字段，形成 credentials-secret.yaml 所需资源。 */}}
type: Opaque{{/* 行说明：使用通用 Secret 类型保存 Elasticsearch 管理员密码。 */}}
data:{{/* 行说明：配置 data 字段，形成 credentials-secret.yaml 所需资源。 */}}
  elastic-password: {{ $password | quote }}{{/* 行说明：配置 elastic-password 字段，形成 credentials-secret.yaml 所需资源。 */}}
{{- /* 行说明：结束当前 Helm 定义、条件或遍历块。 */}}{{- end }}
