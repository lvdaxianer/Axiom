{{- if not .Values.security.existingCredentialsSecret }}
{{- $name := include "uino-elasticsearch.credentialsSecretName" . -}}
{{- $password := randAlphaNum 32 | b64enc -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- if $existing -}}
{{- $existingData := default dict $existing.data -}}
{{- if or (not (hasKey $existingData "elastic-password")) (empty (index $existingData "elastic-password")) -}}
{{- fail "managed credentials Secret must contain a non-empty elastic-password key" -}}
{{- end -}}
{{- $password = index $existing.data "elastic-password" -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "uino-elasticsearch.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  elastic-password: {{ $password | quote }}
{{- end }}
