{{- /* 文件说明：通过 MetalLB 固定 IP 暴露 Elasticsearch HTTPS 9200，并限制外部来源网段。 */ -}}
apiVersion: v1{{/* 行说明：指定 Kubernetes 或 Helm 使用的 API 版本。 */}}
kind: Service{{/* 行说明：声明当前清单创建的 Kubernetes 资源类型。 */}}
metadata:{{/* 行说明：配置 metadata 字段，形成 http-service.yaml 所需资源。 */}}
  name: {{ include "uino-elasticsearch.fullname" . }}{{/* 行说明：设置当前对象、容器、端口或引用项的名称。 */}}
  labels:{{/* 行说明：配置 labels 字段，形成 http-service.yaml 所需资源。 */}}
    {{- /* 行说明：执行 Helm 模板表达式并将结果写入当前位置。 */}}{{- include "uino-elasticsearch.labels" . | nindent 4 }}
  annotations:{{/* 行说明：配置 MetalLB 固定 IP 参数及允许透传的自定义注解。 */}}
    {{- /* 两代 MetalLB 保留键只由 Chart 渲染，模板层继续防御 schema 绕过。 */}}
    {{- /* 行说明：遍历配置集合并为每个元素渲染对应内容。 */}}{{- range $key, $value := .Values.service.annotations }}
    {{- /* 行说明：仅在该 Helm 条件成立时渲染后续内容。 */}}{{- if not (has $key (list "metallb.universe.tf/address-pool" "metallb.universe.tf/loadBalancerIPs" "metallb.universe.tf/protocol" "metallb.universe.tf/allow-shared-ip" "metallb.io/address-pool" "metallb.io/loadBalancerIPs" "metallb.io/protocol" "metallb.io/allow-shared-ip")) }}
    {{ $key | quote }}: {{ $value | quote }}{{/* 行说明：执行 Helm 模板表达式并将结果写入当前位置。 */}}
    {{- /* 行说明：结束当前 Helm 定义、条件或遍历块。 */}}{{- end }}
    {{- /* 行说明：结束当前 Helm 定义、条件或遍历块。 */}}{{- end }}
    metallb.universe.tf/address-pool: {{ .Values.service.addressPool | quote }}{{/* 行说明：配置 metallb.universe.tf/address-pool 字段，形成 http-service.yaml 所需资源。 */}}
    metallb.universe.tf/loadBalancerIPs: {{ .Values.service.loadBalancerIP | quote }}{{/* 行说明：配置 metallb.universe.tf/loadBalancerIPs 字段，形成 http-service.yaml 所需资源。 */}}
    metallb.universe.tf/protocol: {{ .Values.service.protocol | quote }}{{/* 行说明：配置 metallb.universe.tf/protocol 字段，形成 http-service.yaml 所需资源。 */}}
    {{- /* 行说明：仅在该 Helm 条件成立时渲染后续内容。 */}}{{- if .Values.service.allowSharedIP }}
    metallb.universe.tf/allow-shared-ip: {{ .Values.service.sharedIPKey | quote }}{{/* 行说明：配置 metallb.universe.tf/allow-shared-ip 字段，形成 http-service.yaml 所需资源。 */}}
    {{- /* 行说明：结束当前 Helm 定义、条件或遍历块。 */}}{{- end }}
spec:{{/* 行说明：配置 spec 字段，形成 http-service.yaml 所需资源。 */}}
  type: {{ .Values.service.type }}{{/* 行说明：指定外部访问 Service 类型，离线部署使用 LoadBalancer。 */}}
  loadBalancerIP: {{ .Values.service.loadBalancerIP | quote }}{{/* 行说明：指定 MetalLB 为 Elasticsearch 保留的固定访问 IP。 */}}
  # Local 保留外部客户端源地址，使 NetworkPolicy ipBlock 可按 CIDR 判断。
  externalTrafficPolicy: {{ .Values.service.externalTrafficPolicy }}{{/* 行说明：保留外部客户端源地址供访问控制判断。 */}}
  loadBalancerSourceRanges:{{/* 行说明：列出允许访问固定 IP 的客户端 CIDR。 */}}
    {{- /* 行说明：执行 Helm 模板表达式并将结果写入当前位置。 */}}{{- toYaml .Values.service.loadBalancerSourceRanges | nindent 4 }}
  selector:{{/* 行说明：配置 selector 字段，形成 http-service.yaml 所需资源。 */}}
    {{- /* 行说明：执行 Helm 模板表达式并将结果写入当前位置。 */}}{{- include "uino-elasticsearch.selectorLabels" . | nindent 4 }}
  ports:{{/* 行说明：配置 ports 字段，形成 http-service.yaml 所需资源。 */}}
    - name: http{{/* 行说明：设置当前对象、容器、端口或引用项的名称。 */}}
      protocol: TCP{{/* 行说明：使用 TCP 承载 Elasticsearch HTTPS 请求。 */}}
      port: {{ .Values.service.port }}{{/* 行说明：暴露 values 中配置的 Elasticsearch HTTPS 服务端口。 */}}
      targetPort: http{{/* 行说明：配置 targetPort 字段，形成 http-service.yaml 所需资源。 */}}
